<a class="note-row" href="{{ .RelPermalink }}"><div class="note-row-date"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>{{ with .Params.paperVenue }}<span>{{ . }}</span>{{ end }}</div><div class="note-row-body"><h3>{{ .Title }}</h3><p>{{ with .Description }}{{ . }}{{ else }}{{ with .Params.summary }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 130 }}{{ end }}{{ end }}</p><div class="note-row-tags">{{ range first 3 .Params.tags }}<span>{{ . }}</span>{{ end }}</div></div><span class="note-row-arrow" aria-hidden="true">↗</span></a>
